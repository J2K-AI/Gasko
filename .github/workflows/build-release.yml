name: Build & Release Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 🛎 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐢 Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: 🐢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🚀 Expo Prebuild (generate Android native project)
        run: npx expo prebuild --platform android --clean

      - name: 📱 Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --warning-mode all

      - name: 📦 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gasko-Android-APK
          path: android/app/build/outputs/apk/release/*.apk

  build-ios:
    name: Build iOS App (Simulator / Testing)
    runs-on: macos-15

    steps:
      - name: 🛎 Checkout repository
        uses: actions/checkout@v4

      - name: 🍎 Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: 🐢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🚀 Expo Prebuild (generate iOS native project and pods)
        run: npx expo prebuild --platform ios --clean

      - name: 🔨 Build iOS Simulator App (.app.zip)
        run: |
          cd ios
          xcodebuild -workspace Gasko.xcworkspace \
            -scheme Gasko \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

          # Comprimir el .app generado para distribución/testing
          cd build/Build/Products/Release-iphonesimulator
          zip -r ../../../../Gasko-iOS-Simulator.app.zip Gasko.app

      - name: 📦 Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gasko-iOS-Simulator-App
          path: Gasko-iOS-Simulator.app.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/') && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')

    steps:
      - name: 🛎 Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Android APK Artifact
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Gasko-Android-APK
          path: release-assets/

      - name: 📥 Download iOS App Artifact
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Gasko-iOS-Simulator-App
          path: release-assets/

      - name: 🚀 Create GitHub Release with Android & iOS
        uses: softprops/action-gh-release@v2
        with:
          name: "Gasko ${{ github.ref_name }}"
          body: |
            ## ⛽ Gasko ${{ github.ref_name }}

            ### 📱 Android
            - Descarga `app-release.apk`
            - Activa **"Instalar de fuentes desconocidas"** en tu teléfono
            - Abre el archivo para instalar

            ### 🍎 iPhone / iOS
            - **Descarga para pruebas**: `Gasko-iOS-Simulator.app.zip` (para arrastrar a simulador de iOS en Mac o AltStore / sideloading).
            - **Para instalar directamente en tu iPhone físico de inmediato**:
              1. Instala la app gratuita **Expo Go** desde la App Store en tu iPhone.
              2. Conéctate a la app o escanea el QR del proyecto.

            ---
            *Precios actualizados en tiempo real del Ministerio (MITECO) · Arquitectura Hexagonal*
          files: release-assets/*
